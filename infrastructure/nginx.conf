server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 client_max_body_size 64k;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location /api/ { proxy_buffering off; proxy_pass http://api:8080; proxy_read_timeout 200s; proxy_set_header Host localhost; proxy_set_header X-Forwarded-Proto $scheme; proxy_cookie_path / /; }
 location /openapi/ { proxy_pass http://api:8080; proxy_read_timeout 200s; proxy_set_header Host localhost; }
 location / { try_files $uri $uri/ /index.html; }
}
